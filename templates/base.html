<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport"
              content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description"
              content="{% block meta_description %}Gravel rides, campsites and routes — one van, endless roads.{% endblock %}" />
        <title>{% block title %}BulliExplorer{% endblock %}</title>
        <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
        <!-- Design system: self-hosted fonts + CSS custom-property tokens.
         Replaces the previous framework-based theme and CDN font/icon
         scripts (Phase 1, docs/dev/ui_ux_refresh.md). -->
        <link href="/static/theme.css" rel="stylesheet" />
        <!-- No-flash theme pre-paint (Phase 2, §5.4): read the persisted choice
         (or fall back to the OS preference) and set data-theme before the
         browser paints anything, so there is no light->dark flash on load.
         Inline and tiny on purpose — this has to run before first paint. -->
        <script>
            (function () {
                "use strict";
                var stored = null;
                try {
                    stored = localStorage.getItem("theme");
                } catch (e) {
                    /* localStorage unavailable (private mode etc.) — fall through to OS preference */
                }
                var theme =
                    stored === "light" || stored === "dark"
                        ? stored
                        : window.matchMedia("(prefers-color-scheme: dark)")
                                .matches
                          ? "dark"
                          : "light";
                document.documentElement.setAttribute("data-theme", theme);
            })();
        </script>
        {% block head %}{% endblock %}
    </head>
    <body>
        {% import "partials/icons.html" as icons %}
        <!-- Navigation — semantic <details>/<summary>, no JS dependency -->
        <nav class="site-nav" id="mainNav">
            <div class="container">
                <a class="brand" href="/">BulliExplorer</a>
                <div class="nav-right">
                    <button type="button"
                            id="theme-toggle"
                            class="theme-toggle"
                            aria-label="Toggle dark mode"
                            aria-pressed="false">
                        {{ icons.icon_sun(cls="icon theme-toggle-sun") }} {{ icons.icon_moon(cls="icon theme-toggle-moon") }}
                    </button>
                    <details class="nav-toggle">
                        <summary aria-label="Toggle navigation">{{ icons.icon_menu() }} Menu</summary>
                        <ul class="nav-links">
                            <li><a href="/">Home</a></li>
                        </ul>
                    </details>
                </div>
            </div>
        </nav>
        <!-- Page Header -->
        {% block page_header %}{% endblock %}
        <!-- Main Content -->
        {% block content %}{% endblock %}
        <!-- Footer -->
        <footer class="site-footer">
            <div class="container">© {{ year }} BulliExplorer</div>
        </footer>
        <!-- Dark-mode toggle: reflects/updates the pre-paint script's choice,
         persists it to localStorage so it overrides the OS preference on
         future visits (§5.4). Deferred to end-of-body — no-flash correctness
         only depends on the inline <head> script above, not on this. -->
        <script>
            (function () {
                "use strict";
                var root = document.documentElement;
                var btn = document.getElementById("theme-toggle");
                if (!btn) return;

                function reflect() {
                    var isDark = root.getAttribute("data-theme") === "dark";
                    btn.setAttribute("aria-pressed", String(isDark));
                }
                reflect();

                btn.addEventListener("click", function () {
                    var next =
                        root.getAttribute("data-theme") === "dark"
                            ? "light"
                            : "dark";
                    root.setAttribute("data-theme", next);
                    try {
                        localStorage.setItem("theme", next);
                    } catch (e) {
                        /* localStorage unavailable — toggle still works for this page load */
                    }
                    reflect();
                    // Let same-page listeners (e.g. the post map's live basemap
                    // swap in post.html) react without a reload. Dispatched on
                    // document so any page can listen without base.html knowing
                    // about them.
                    document.dispatchEvent(
                        new CustomEvent("bulliexplorer:themechange", {
                            detail: { theme: next },
                        }),
                    );
                });
            })();
        </script>
        {% block scripts %}{% endblock %}
    </body>
</html>
