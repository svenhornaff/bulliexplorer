<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="{% block meta_description %}Gravel rides, campsites and routes — one van, endless roads.{% endblock %}" />
    <title>{% block title %}BulliExplorer{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <!-- Design system: self-hosted fonts + CSS custom-property tokens.
         Replaces the previous framework-based theme and CDN font/icon
         scripts (Phase 1, docs/dev/ui_ux_refresh.md). -->
    <link href="/static/theme.css" rel="stylesheet" />
    {% block head %}{% endblock %}
</head>
<body>
    {% import "partials/icons.html" as icons %}

    <!-- Navigation — semantic <details>/<summary>, no JS dependency -->
    <nav class="site-nav" id="mainNav">
        <div class="container">
            <a class="brand" href="/">BulliExplorer</a>
            <details class="nav-toggle">
                <summary aria-label="Toggle navigation">
                    {{ icons.icon_menu() }} Menu
                </summary>
                <ul class="nav-links">
                    <li><a href="/">Home</a></li>
                </ul>
            </details>
        </div>
    </nav>

    <!-- Page Header -->
    {% block page_header %}{% endblock %}

    <!-- Main Content -->
    {% block content %}{% endblock %}

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            &copy; {{ year }} BulliExplorer
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
