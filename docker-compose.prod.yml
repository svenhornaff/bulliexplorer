services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - LEGAL_CLASSIFICATION=${LEGAL_CLASSIFICATION:-}
      - LEGAL_NAME=${LEGAL_NAME:-}
      - LEGAL_ADDRESS=${LEGAL_ADDRESS:-}
      - LEGAL_EMAIL=${LEGAL_EMAIL:-}
      # LEGAL_HOSTING/LOG_RETENTION/CLOUDFLARE_DETAILS/SENTRY_DETAILS
      # removed 2026-09-18 — see docs/dev/legal_gdpr_classification_refactor.md
      # Phase 5; datenschutz.md now uses static abstracted categories.
      - LOG_JSON=true
      - DATABASE_URL=postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/bulliexplorer
      - SECRET_KEY=${SECRET_KEY}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-bulliexplorer}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - TILES_URL=${TILES_URL:-}
      - SITE_URL=${SITE_URL:-https://bulliexplorer.com}
      - GOOGLE_SITE_VERIFICATION=${GOOGLE_SITE_VERIFICATION:-}
      - ENABLE_AMENITY_DISCOVERY=${ENABLE_AMENITY_DISCOVERY:-false}
      - RESYNC_TOKEN=${RESYNC_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
    # Docker daemon defaults (no explicit max-size/max-file) allow
    # unbounded json-file log growth on this 4GB host — a real risk from
    # a chatty app (Overpass warnings alone are high-volume on bad days)
    # — and were the reason an 08:46-08:48 log window went missing
    # during an earlier sync investigation (F6, docs/dev/review_17SEP2026.md).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;\
          urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "8000"
    volumes:
      - ./content/posts:/app/content/posts
      - ./static:/app/static

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bulliexplorer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
