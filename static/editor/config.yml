# Sveltia CMS configuration for BulliExplorer.
#
# Auth: GitHub personal access token (PAT).
# On the login screen click "Sign In with Token" and paste your fine-grained
# PAT (repository: bulliexplorer, permission: Contents Read+Write).
# No base_url / OAuth Worker needed for single-user instances.
#
# Fields mirror PostFrontmatter (app/models/post_schema.py) exactly.
# Key names match the YAML frontmatter keys written to content/posts/*.md,
# not the Python field names (e.g. "date" not "published_date",
# "draft" not "is_draft").

backend:
  name: github
  repo: svenhornaff/bulliexplorer
  branch: develop
  # No auth_type needed — PAT login is always available via the
  # "Sign In with Token" button on the Sveltia CMS login screen.

# Media (media_storage_r2.md Phase 1-2) — uploads route browser →
# Cloudflare R2 directly, off git. No media_folder/public_folder here on
# purpose: Sveltia only requires them when there's no cloud media
# library configured (src/lib/services/config/parser/media.js), and R2
# is now the *only* option below — deliberately, so there's no
# git-vs-R2 picker and no way to accidentally upload back into git.
#
# The actual media_libraries block is injected server-side at request
# time — see app/routes/internal.py's /editor/config.yml route — sourced
# from R2_ACCESS_KEY_ID / R2_ACCOUNT_ID / R2_PUBLIC_URL in .env on the
# server. Nothing credential-shaped lives in this file: it's a public
# static asset served to any browser that asks, and anything written
# here is permanently visible in git history the moment it's committed.
#
# To activate on a fresh server: set the three R2_* vars in .env
# (Cloudflare dashboard → R2 → Manage R2 API Tokens → Object Read &
# Write, scoped to the bulliexplorer bucket, dedicated token — not the
# one used for the manual PMTiles upload), then `make deploy`.

collections:
  - name: "posts"
    label: "Posts"
    label_singular: "Post"
    folder: "content/posts"
    create: true
    # Sveltia uses the slug field value as the filename: <slug>.md
    slug: "{{fields.slug}}"
    format: "frontmatter"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Post title, shown in the list and as the page <h1>."

      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL path segment — e.g. 'kinzig-valley-loop'. Lowercase, hyphens only."
        pattern: ["^[a-z0-9-]+$", "Lowercase letters, digits and hyphens only"]

      - label: "Published date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "Date the post is (or will be) published."

      - label: "Summary"
        name: "summary"
        widget: "text"
        required: false
        hint: "One-paragraph excerpt shown in the post list and as the hero subheading."

      - label: "Cover image"
        name: "cover_image"
        widget: "image"
        required: false
        hint: "Uploaded to Cloudflare R2. Leave blank for the default dark header."

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Comma-separated list of tags, e.g. gravel, germany, bikepacking."

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: true
        hint: "Draft posts are hidden on production but visible in development."

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: >-
          Post body in Markdown. Images can be uploaded via the toolbar.
          To place a gallery, callout, or the route map at a specific spot in
          the text, put one of these markers on its own line:
          [[gallery:<id>]], [[callout:<id>]], [[route-map]] — the <id> must
          match a "Galleries"/"Callouts" entry's ID below. If [[route-map]]
          is omitted and this post has a route, the map still renders after
          the body automatically.

      # ── Geo fields (Phase 3 — maps_gis.md) ────────────────────────────────
      # Both fields are optional — posts without a route or POIs are unaffected.

      - label: "Route (GPX)"
        name: "route"
        widget: "object"
        required: false
        hint: "Upload the GPX track recorded on a bike computer or app."
        fields:
          - { label: "Route name", name: "name", widget: "string" }
          - label: "GPX file"
            name: "gpx_file"
            widget: "file"
            accept: ".gpx,application/gpx+xml"
            hint: "Uploaded to Cloudflare R2. Sync fetches it from there automatically."
          - {
              label: "Description",
              name: "description",
              widget: "text",
              required: false,
            }

      - label: "Points of interest"
        name: "points_of_interest"
        widget: "list"
        required: false
        hint: "Campsites, restaurants, viewpoints, etc. mentioned in the post."
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - label: "Category"
            name: "category"
            widget: "select"
            options:
              - { label: "Campsite", value: "campsite" }
              - { label: "Shelter", value: "shelter" }
              - { label: "Restaurant", value: "restaurant" }
              - { label: "Hotel", value: "hotel" }
              - { label: "Gas station", value: "gas_station" }
              - { label: "Viewpoint", value: "viewpoint" }
              - { label: "Bike shop", value: "bike_shop" }
              - { label: "Water point", value: "water_point" }
              - { label: "Other", value: "other" }
          - label: "Place name or address"
            name: "place_query"
            widget: "string"
            required: false
            hint: "Geocoded automatically on sync. Leave blank if you prefer to set coordinates manually."
          - {
              label: "Latitude (manual override)",
              name: "lat",
              widget: "number",
              value_type: "float",
              required: false,
            }
          - {
              label: "Longitude (manual override)",
              name: "lng",
              widget: "number",
              value_type: "float",
              required: false,
            }
          - { label: "Notes", name: "notes", widget: "text", required: false }

      # ── Body-block content (Phase 4 — ui_ux_refresh.md §5.3) ────────────
      # Both are optional and have no effect unless referenced by a
      # [[gallery:<id>]] / [[callout:<id>]] marker in the Body field above.
      # Defining one here without using its marker is simply unused, not an
      # error — it just won't render anywhere.

      - label: "Galleries"
        name: "galleries"
        widget: "list"
        required: false
        hint: >-
          Named image galleries you can place in the body with a
          [[gallery:<id>]] marker. The ID here must match the marker exactly.
        fields:
          - label: "ID"
            name: "id"
            widget: "string"
            hint: "Short identifier used in the body marker, e.g. 'coffee-stop'."
            pattern:
              ["^[a-z0-9-]+$", "Lowercase letters, digits and hyphens only"]
          - label: "Images"
            name: "images"
            widget: "list"
            fields:
              - label: "Image"
                name: "src"
                widget: "image"
              - label: "Alt text"
                name: "alt"
                widget: "string"
                hint: "Required — describes the image for screen readers. Not decorative filler."
              - {
                  label: "Caption",
                  name: "caption",
                  widget: "string",
                  required: false,
                }

      - label: "Callouts"
        name: "callouts"
        widget: "list"
        required: false
        hint: >-
          Named tip/warning asides you can place in the body with a
          [[callout:<id>]] marker. The ID here must match the marker exactly.
        fields:
          - label: "ID"
            name: "id"
            widget: "string"
            hint: "Short identifier used in the body marker, e.g. 'tip-1'."
            pattern:
              ["^[a-z0-9-]+$", "Lowercase letters, digits and hyphens only"]
          - label: "Variant"
            name: "variant"
            widget: "select"
            default: "tip"
            options:
              - { label: "Tip", value: "tip" }
              - { label: "Warning", value: "warning" }
              - { label: "Note", value: "note" }
          - { label: "Title", name: "title", widget: "string", required: false }
          - label: "Body"
            name: "body"
            widget: "text"
            hint: "Short callout text — a sentence or two, not a full section."