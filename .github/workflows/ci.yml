name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bulliexplorer
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: >-
        postgresql+psycopg://postgres:postgres@localhost:5433/bulliexplorer
      SECRET_KEY: ci-test-secret-not-for-production
      RESYNC_TOKEN: ci-test-resync-token
      GITHUB_TOKEN_APP: ci-test-github-token
      WEBHOOK_SECRET: ci-test-webhook-secret

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group security

      # Real, pre-existing gap found while implementing
      # docs/dev/playwright_e2e_smoke_tests.md: this service container is
      # fresh/unmigrated on every run, and neither the app's own lifespan
      # nor any test fixture applies migrations. Reproduced locally against
      # a genuinely fresh postgis/postgis:16-3.4 container (not the
      # persistent local dev DB, which already has migrations applied and
      # so never surfaced this): every integration test touching the
      # schema failed with UndefinedTable. This means the real GitHub
      # Actions run has been failing at the Test step on every push this
      # session — `make ci` run locally never caught it, since it always
      # ran against the already-migrated persistent dev DB.
      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Lint (ruff + pyright)
        run: |
          uv run ruff format app tests --check
          uv run ruff check app tests
          uv run pyright app tests

      - name: Test (pytest + coverage)
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN_APP }}
        run: uv run pytest

      # docs/dev/playwright_e2e_smoke_tests.md — a third tier, on top of
      # the same real PostGIS service container already running above,
      # against a dedicated `_e2e`-suffixed database (see
      # tests/e2e/conftest.py's own _database_url fixture for why: this
      # tier's fixture seeding reconciles/deletes, and must never share
      # a database with anything real). Runs alongside, not instead of,
      # the unit/integration Test step above — both gate merges.
      - name: Install Playwright browser (Chromium)
        run: uv run --group e2e playwright install --with-deps chromium

      - name: E2E smoke tests (Playwright)
        run: uv run --group e2e pytest tests/e2e -m e2e --no-cov

      - name: Security (bandit + detect-secrets + pip-audit)
        run: |
          uv run bandit -r app -c pyproject.toml
          uv run detect-secrets scan app/ > /tmp/secrets-scan.json && \
            python3 -c "
          import json, sys
          with open('.secrets.baseline') as f:
              a = json.load(f)
          with open('/tmp/secrets-scan.json') as f:
              b = json.load(f)
          a.pop('generated_at', None)
          b.pop('generated_at', None)
          if a != b:
              print('detect-secrets: baseline mismatch', file=sys.stderr)
              sys.exit(1)
          sys.exit(0)"
          uv run pip-audit

      # docs/dev/security_review_owasp.md Phase 5 — voluntary, not a CRA
      # requirement for this project (see that doc for why). Reuses
      # pip-audit's own already-resolved dependency data via its native
      # --format=cyclonedx-json — no new scan, no new dependency. Not
      # published publicly: a GitHub Actions artifact requires repo
      # access to download, same internal-only posture as
      # docs/dev/DATA_PROCESSING.md versus the public /datenschutz page.
      - name: Generate SBOM (CycloneDX)
        run: uv run pip-audit --format=cyclonedx-json -o sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
