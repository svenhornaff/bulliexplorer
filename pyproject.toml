[project]
name = "bulliexplorer"
version = "0.1.0"
description = "FastAPI + Jinja2 + HTMX blog with PostGIS-backed campsites/routes"
readme = "README.md"
authors = [
    { name = "Sven Hornaff", email = "sven.hornaff@t-systems.com" }
]
requires-python = ">=3.12.13"
dependencies = [
    "alembic>=1.19.1",
    "boto3>=1.43.78",
    "fastapi>=0.115.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "geoalchemy2>=0.20.0",
    "jinja2>=3.1.0",
    "markdown-it-py>=4.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.12",
    "sqladmin>=0.31.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]
security = [
    "bandit>=1.9.4",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
]

# ── Lint / format ─────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

# ── Types ─────────────────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["app"]
exclude = ["tests", "alembic"]

# ── SAST ──────────────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

# ── Tests + coverage ────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=60",
]
markers = [
    "unit: no external dependencies",
    "integration: database or external services",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/alembic/*", "*/__init__.py"]
